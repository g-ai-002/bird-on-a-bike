publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: 1.38.2
  flutter_scene: 0.24.3
  provider: 6.1.5+1
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  path: 1.9.1
  vector_math: 2.4.3
  window_manager: 0.5.2
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
