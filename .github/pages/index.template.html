<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITLE__ · 历史版本</title>
  <meta name="description" content="__TITLE__ 的历史版本列表，每个发布 tag 对应一个可独立试玩的 Web 版本。">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px 64px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: #eaf6f4;
      background: radial-gradient(circle at 50% -20%, #1a4a52 0%, #0b2a2e 45%, #061416 100%);
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 34px); letter-spacing: 1px; }
    header p { margin: 0; color: #9fc4c0; font-size: 14px; line-height: 1.7; }
    .list {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .card {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(95, 211, 196, 0.22);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #5fd3c4;
      background: rgba(95, 211, 196, 0.14);
    }
    .ver { display: block; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #04211f;
      background: #5fd3c4;
      vertical-align: 2px;
    }
    .go { display: block; margin-top: 6px; font-size: 12px; color: #9fc4c0; }
    footer { margin-top: 36px; text-align: center; font-size: 12px; line-height: 1.8; color: #7ea5a1; }
    footer a { color: #5fd3c4; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>__TITLE__</h1>
      <p>每个发布 tag 对应一个独立的 Web 版本，历史版本长期保留，可随时回看。<br>桌面端用键盘（空格 / ↑ 跳跃、↓ 俯身），移动端用点击与滑动。</p>
    </header>
    <div class="list">
__VERSIONS__
    </div>
    <footer>
      <p>仓库：<a href="https://github.com/__REPO__">__REPO__</a> · 更新于 __UPDATED__</p>
      <p>Android APK 与 Windows ZIP 请到该仓库的 Releases 页面下载。</p>
    </footer>
  </div>
</body>
</html>
