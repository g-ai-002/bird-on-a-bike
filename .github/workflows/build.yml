name: 🚀 构建与发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

run-name: 🚴 构建 ${{ github.ref_name }}

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: 📋 准备包元数据
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🔢 解析包版本号
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            fi
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "📌 使用的版本号: $jversion"

      - name: 🏷️ 计算项目名称
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "📌 Flutter 项目名: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-latest
    name: 🧪 运行 Dart 测试
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🦋 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🔍 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: ✅ 运行测试
        run: flutter test --concurrency=2

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-latest
    name: 🤖 构建 Android APK
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: ☕ 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🦋 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🩺 诊断网络与 Flutter 环境
        run: |
          echo "=== 🌍 构建环境变量 ==="
          echo "USE_ALIYUN_MAVEN=${USE_ALIYUN_MAVEN:-<未设置>}"
          echo "JAVA_HOME=${JAVA_HOME:-<未设置>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-<未设置>}"
          echo "http_proxy=${http_proxy:-<未设置>}"
          echo "https_proxy=${https_proxy:-<未设置>}"
          echo "=== 🦋 Flutter 版本 ==="
          flutter --version
          echo "=== 🩺 Flutter doctor ==="
          timeout 10 flutter doctor -v || true
          echo "=== 🌍 Flutter 相关环境变量 ==="
          echo "FLUTTER_STORAGE_BASE_URL=${FLUTTER_STORAGE_BASE_URL:-<未设置>}"
          echo "PUB_HOSTED_URL=${PUB_HOSTED_URL:-<未设置>}"
          echo "=== 🌐 网络连通性检查 ==="
          curl -sI --connect-timeout 10 https://storage.flutter-io.cn 2>&1 || echo "❌ 无法访问 storage.flutter-io.cn"
          curl -sI --connect-timeout 10 https://storage.googleapis.com 2>&1 || echo "❌ 无法访问 storage.googleapis.com"

      - name: 🔨 构建 Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: 📝 重命名 Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: ⬆️ 上传 Android 产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          retention-days: 1

  build-windows:
    needs: [ metadata, test ]
    runs-on: windows-latest
    name: 🪟 构建 Windows EXE
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        working-directory: C:\w
        shell: bash
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 📂 复制工程到短路径
        shell: bash
        working-directory: C:/
        run: |
          set -euo pipefail
          src=$(cygpath -u "$GITHUB_WORKSPACE")
          rm -rf /c/w
          mkdir -p /c/w
          cp -a "$src"/. /c/w/
          echo "✅ 工程已复制: $src -> C:\\w"

      - name: ☕ 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🦋 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🩺 诊断网络与 Flutter 环境
        shell: bash
        run: |
          echo "=== 🌍 构建环境变量 ==="
          echo "http_proxy=${http_proxy:-<未设置>}"
          echo "https_proxy=${https_proxy:-<未设置>}"
          echo "=== 🦋 Flutter 版本 ==="
          flutter --version
          echo "=== 🩺 Flutter doctor ==="
          timeout 10 flutter doctor -v || true
          echo "=== 🌍 Flutter 相关环境变量 ==="
          echo "FLUTTER_STORAGE_BASE_URL=${FLUTTER_STORAGE_BASE_URL:-<未设置>}"
          echo "PUB_HOSTED_URL=${PUB_HOSTED_URL:-<未设置>}"
          echo "=== 🌐 网络连通性检查 ==="
          curl -sI --connect-timeout 10 https://storage.flutter-io.cn 2>&1 || echo "❌ 无法访问 storage.flutter-io.cn"
          curl -sI --connect-timeout 10 https://storage.googleapis.com 2>&1 || echo "❌ 无法访问 storage.googleapis.com"

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🏗️ 生成 Windows 平台文件
        run: flutter create --platforms=windows --project-name ${{ needs.metadata.outputs.project_name }} .

      - name: 🩹 CMakeLists 启用 CMP0091 策略（audioplayers_windows 4.x + VS 2026 要求）
        shell: bash
        run: |
          sed -i -E 's|^(cmake_minimum_required\(VERSION [0-9.]+\))$|\1\ncmake_policy(SET CMP0091 NEW)|' windows/CMakeLists.txt
          grep -n 'CMP0091' windows/CMakeLists.txt

      - name: 🔨 构建 Windows
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: flutter build windows --release

      - name: 📊 列出构建产物
        run: |
          release_dir='build/windows/x64/runner/Release'
          if [ -d "$release_dir" ]; then
            total_bytes=0
            for f in "$release_dir"/*; do
              if [ -f "$f" ]; then
                size=$(stat -c%s "$f")
                size_mb=$(awk "BEGIN{printf \"%.2f\", $size/1048576}")
                echo "  📄 $(basename "$f")  ($size_mb MB)"
                total_bytes=$((total_bytes + size))
              fi
            done
            total_mb=$(awk "BEGIN{printf \"%.2f\", $total_bytes/1048576}")
            echo "  📊 合计: $total_mb MB"
          else
            echo "❌ 未找到构建输出目录"
            exit 1
          fi

      - name: 🗜️ 打包 Windows ZIP
        shell: pwsh
        run: |
          Write-Host "🗜️ 正在创建 ZIP 包..."
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows.zip
          $zipSizeMB = [math]::Round((Get-Item windows.zip).Length / 1MB, 2)
          Write-Host "✅ ZIP 创建完成: windows.zip ($zipSizeMB MB)"

      - name: 📝 重命名 Windows ZIP
        run: |
          mv windows.zip ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip

      - name: ⬆️ 上传 Windows 产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: C:/w/${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          retention-days: 1


  # ========== 🌐 发布 Flutter Web 到 GitHub Pages ==========
  build-web:
    needs: [ metadata, test ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: 🌐 构建 Web 并发布 Pages
    permissions:
      contents: write  # ✅ 需要向 gh-pages 分支推送站点
    timeout-minutes: 30
    concurrency:
      group: pages-${{ github.event.repository.name }}
      cancel-in-progress: false  # ✅ 多个 tag 串行发布，避免同时写 gh-pages
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🦋 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🌐 生成并汉化 Web 平台文件
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=web --project-name ${{ needs.metadata.outputs.project_name }} .

          app_desc=$(grep '^description:' pubspec.yaml | sed -E 's/^description:[[:space:]]*//')
          app_title=$(echo "$app_desc" | sed -E 's/[[:space:]]*-.*$//')
          echo "📌 站点标题: $app_title"
          echo "📌 站点描述: $app_desc"

          sed -i "s|<title>.*</title>|<title>${app_title}</title>|" web/index.html
          sed -i "s|<meta name=\"description\" content=\"[^\"]*\">|<meta name=\"description\" content=\"${app_desc}\">|" web/index.html
          sed -i "s|<meta name=\"apple-mobile-web-app-title\" content=\"[^\"]*\">|<meta name=\"apple-mobile-web-app-title\" content=\"${app_title}\">|" web/index.html
          sed -i "s|<meta name=\"theme-color\" content=\"[^\"]*\">|<meta name=\"theme-color\" content=\"#0E7C86\">|" web/index.html

          jq --arg name "$app_title" --arg desc "$app_desc" \
            '.name = $name | .short_name = $name | .description = $desc | .theme_color = "#0E7C86" | .background_color = "#0B2A2E"' \
            web/manifest.json > web/manifest.json.tmp
          mv web/manifest.json.tmp web/manifest.json

          echo "--- 📄 web/manifest.json ---"
          cat web/manifest.json

      - name: 🔨 构建 Web 产物
        shell: bash
        run: |
          set -euo pipefail
          version_path="v${{ needs.metadata.outputs.app_version }}"
          flutter build web --release --base-href "/${{ env.APP_NAME }}/${version_path}/"
          du -sh build/web

      - name: 📚 检出 gh-pages 站点分支
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "ℹ️ gh-pages 分支不存在，用空孤儿提交初始化"
            empty_tree=$(git mktree < /dev/null)
            init_commit=$(git commit-tree "$empty_tree" -m "🌐 初始化 GitHub Pages")
            git push origin "$init_commit:refs/heads/gh-pages"
          fi

          git fetch --no-tags --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach pages refs/remotes/origin/gh-pages
          echo "📂 站点现有版本目录："
          find pages -maxdepth 1 -mindepth 1 -type d -name 'v*' -printf '  📁 %f\n' | sort -V || true

      - name: 🗂️ 写入版本目录（保留历史版本）
        shell: bash
        run: |
          set -euo pipefail
          version_path="v${{ needs.metadata.outputs.app_version }}"
          rm -rf "pages/${version_path}"
          mkdir -p "pages/${version_path}"
          cp -a build/web/. "pages/${version_path}/"
          touch pages/.nojekyll
          echo "✅ 已写入 pages/${version_path}"
          du -sh "pages/${version_path}"

      - name: 🏠 生成版本索引页
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(find pages -maxdepth 1 -mindepth 1 -type d -name 'v*' -printf '%f\n' | sort -V -r)
          if [ "${#versions[@]}" -eq 0 ]; then
            echo "❌ 未找到任何版本目录"
            exit 1
          fi
          latest="${versions[0]}"
          app_title=$(grep '^description:' pubspec.yaml | sed -E 's/^description:[[:space:]]*//; s/[[:space:]]*-.*$//')
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          echo "📌 共 ${#versions[@]} 个版本，最新 ${latest}"

          : > /tmp/version-items.html
          for i in "${!versions[@]}"; do
            v="${versions[$i]}"
            badge=""
            if [ "$i" -eq 0 ]; then badge='<span class="badge">最新</span>'; fi
            printf '      <a class="card" href="./%s/"><span class="ver">%s%s</span><span class="go">进入试玩 →</span></a>\n' \
              "$v" "$v" "$badge" >> /tmp/version-items.html
          done

          awk -v title="$app_title" -v repo="${{ github.repository }}" -v updated="$now" -v items="/tmp/version-items.html" '
            /__VERSIONS__/ {
              while ((getline line < items) > 0) print line;
              close(items);
              next
            }
            { gsub(/__TITLE__/, title); gsub(/__REPO__/, repo); gsub(/__UPDATED__/, updated); print }
          ' .github/pages/index.template.html > pages/index.html

          printf '%s\n' "${versions[@]}" \
            | jq -R . \
            | jq -s --arg latest "$latest" 'map({version: ., url: ("./" + . + "/"), latest: (. == $latest)})' \
            > pages/versions.json

          echo "--- 📄 versions.json ---"
          cat pages/versions.json

      - name: 🚀 提交并推送站点
        shell: bash
        run: |
          set -euo pipefail
          version_path="v${{ needs.metadata.outputs.app_version }}"
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ 站点内容无变化，跳过提交"
            exit 0
          fi
          git commit -q -m "🌐 发布 Web 版本 ${version_path}"
          git push origin HEAD:refs/heads/gh-pages
          echo "✅ 已推送到 gh-pages"
          echo "🔗 https://${{ github.repository_owner }}.github.io/${{ env.APP_NAME }}/${version_path}/"

  # ========== 🚀 发布到 GitHub Releases ==========
  release:
    needs: [ build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: 🚀 发布 GitHub Release
    permissions:
      contents: write  # ✅ 仅 release job 需要写权限
    environment: release  # ✅ 添加环境保护（可选：要求审批）

    steps:
      - name: 📥 检出代码（用于生成更新日志）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # ✅ 必须获取完整 tag 历史

      - name: ⬇️ 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true  # ✅ 简化目录结构

      - name: 📝 生成发布说明
        id: notes
        run: |
          # 获取上一个标签
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)

          body_content=""
          if [[ -n "$prev_tag" ]]; then
            body_content=$(git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github" ":(exclude).gitea")
          else
            body_content="首次发布。"
          fi

          echo "=== 📝 生成的发布说明 ==="
          echo "$body_content"

          # 写入输出，处理多行字符
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 🚀 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}  # ✅ 自动识别预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
